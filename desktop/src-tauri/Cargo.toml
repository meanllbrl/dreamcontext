[package]
name = "dreamcontext-desktop"
version = "0.26.3"
edition = "2021"

[lib]
name = "dreamcontext_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dreamcontext-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
# OS-native clipboard writes. The WKWebView's JS clipboard (`navigator.clipboard.writeText`)
# re-decodes UTF-8 as Mac Roman (Ş→"≈û", ü→"√º") — see issue #171 / the copyPreservingUnicode
# comment. Routing copies through this Rust-side plugin bypasses the WKWebView entirely and
# round-trips UTF-8 correctly.
tauri-plugin-clipboard-manager = "2"
# Native OS notification banners. WKWebView ships no Web Notification API at all
# (`window.Notification` is simply undefined), so a webview-only implementation is
# impossible — this plugin both injects the `window.Notification` polyfill the JS
# side calls and delivers the banner through NSUserNotification. Used by the
# "Claude is asking" alarm (dashboard/src/lib/attention.ts).
tauri-plugin-notification = "2"
# Converts the Sleepy notch window into a non-activating NSPanel so the hotkey
# summons it OVER whatever app is focused — the user types into it without their
# current app deactivating, and dismissing it never surfaces the dreamcontext
# main window. Standard tool for macOS notch/Spotlight-style panels in Tauri 2.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Group-signal the dashboard-server child (SIGTERM→SIGKILL) on app exit so the
# whole process group is reaped, not just the direct node process. Already present
# transitively via tauri; pinned here so the direct use is explicit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Talk to NSOpenPanel directly instead of routing the file/folder picker through
# tauri-plugin-dialog → rfd. rfd calls `+[NSOpenPanel openPanel]` (and `-URLs`)
# through objc2 bindings typed as NON-NULL, so when AppKit hands back nil the
# generated null-check panics — and with `panic = "abort"` below that panic takes
# the ENTIRE app down mid-file-pick. Owning the call lets us treat nil as an
# error the user can retry. See `pick_paths` in lib.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSView",
    "NSWindow",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
