[package]
name = "dreamcontext-desktop"
version = "0.30.3"
edition = "2021"

[lib]
name = "dreamcontext_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dreamcontext-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-shell = "2"
# OS-native clipboard writes. The WKWebView's JS clipboard (`navigator.clipboard.writeText`)
# re-decodes UTF-8 as Mac Roman (Ş→"≈û", ü→"√º") — see issue #171 / the copyPreservingUnicode
# comment. Routing copies through this Rust-side plugin bypasses the WKWebView entirely and
# round-trips UTF-8 correctly.
tauri-plugin-clipboard-manager = "2"
# Native OS notification banners. WKWebView ships no Web Notification API at all
# (`window.Notification` is simply undefined), so a webview-only implementation is
# impossible — this plugin both injects the `window.Notification` polyfill the JS
# side calls and delivers the banner through NSUserNotification. Used by the
# "Claude is asking" alarm (dashboard/src/lib/attention.ts).
tauri-plugin-notification = "2"
# The dreamcontext Assistant's notch (src/assistant.rs). All three PINNED EXACTLY — the
# removed Sleepy notch floated on `branch = "v2"` and that is not repeated here.
# - global-shortcut: registered from RUST so both Pressed and Released reach the notch
#   (hold-to-talk), while another app is focused.
# - nspanel: the notch as a non-activating NSPanel at y=0 (types without deactivating the
#   app the owner is in). Rev acb3ec1c = the objc2-based v2.1 line, matching our objc2 0.6.
# - autostart: the Login Item; an autostart launch opens only the notch.
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-autostart = "=2.5.1"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "acb3ec1c2d2334916c9b07c74d5a0be9356674e3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of the private Node download (src/node_runtime.rs), checked against the pin in
# assets/runtime-pins.json before anything is unpacked. Already in the lockfile via tauri.
sha2 = "0.10"
# `set_frames` (src/frames.rs) bounds its wait on an AppKit animation with a hard deadline.
# Already the runtime under tauri::async_runtime; only the timer is used directly.
tokio = { version = "1", features = ["time"] }
# Group-signal the dashboard-server child (SIGTERM→SIGKILL) on app exit so the
# whole process group is reaped, not just the direct node process. Already present
# transitively via tauri; pinned here so the direct use is explicit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Talk to NSOpenPanel directly instead of routing the file/folder picker through
# tauri-plugin-dialog → rfd. rfd calls `+[NSOpenPanel openPanel]` (and `-URLs`)
# through objc2 bindings typed as NON-NULL, so when AppKit hands back nil the
# generated null-check panics — and with `panic = "abort"` below that panic takes
# the ENTIRE app down mid-file-pick. Owning the call lets us treat nil as an
# error the user can retry. See `pick_paths` in lib.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSAlert",
    "NSAnimation",
    "NSAnimationContext",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSHapticFeedback",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSSound",
    "NSWorkspace",
    "NSSavePanel",
    "NSView",
    "NSWindow",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
