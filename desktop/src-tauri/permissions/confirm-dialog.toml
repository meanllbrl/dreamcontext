"$schema" = "schemas/schema.json"

# The app's own native confirmation sheet. It exists because WKWebView has no
# working `window.confirm`: wry's WKUIDelegate implements no JavaScript panel
# methods, so WebKit shows no dialog and returns `false`, turning every
# confirm-gated button in the dashboard into a dead one. See `confirm_dialog`
# in src/lib.rs.
[[permission]]
identifier = "allow-confirm-dialog"
description = "Present a native macOS confirmation sheet and return whether the user confirmed."
commands.allow = ["confirm_dialog"]
