"$schema" = "schemas/schema.json"

# Quit the whole app for the update relaunch. Closing every window no longer quits it:
# the notch panel refuses to close. See `quit_app` in src/lib.rs.
[[permission]]
identifier = "allow-quit-app"
description = "Quit the dreamcontext app (used by the update relaunch flow)."
commands.allow = ["quit_app"]
