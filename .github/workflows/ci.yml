name: CI

# Gate every push to main and every PR on the unit/integration suite. Before this
# workflow the only CI was desktop-release.yml (a build-on-tag job that never ran
# vitest), so the test suite never gated a release despite the publish-checklist's
# "tests must be green" rule — exactly how the capture-guard q030 regression shipped
# unnoticed at v0.10.1/v0.10.2.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # A bare CI runner has no git identity or init.defaultBranch, but a normal
      # dev box does. The brain-sync e2e (tests/integration/brain-sync.e2e.test.ts)
      # spins up a local `git init --bare` repo as a GitHub stand-in — and GitHub
      # repos always default to `main`. Without init.defaultBranch=main the bare
      # repo's HEAD points at `master`, so the second clone checks out nothing and
      # the sync reports 'noop' with missing files. Configure git to mirror a real
      # dev environment (identity is also a fallback for any commit path).
      - name: Configure git for tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@dreamcontext.local"
          git config --global user.name "dreamcontext CI"

      - name: Install dependencies
        run: npm ci

      # The dashboard keeps its OWN package.json on purpose (React/Vite/TanStack are
      # never root deps — see the "Dashboard deps are isolated" constraint), so a root
      # `npm ci` does NOT provision it. That was fine while no test reached into
      # dashboard/src, and stopped being fine the moment unit tests started importing
      # its pure logic modules (chatViewSpec, chatEntities, checklistState, chatQueue):
      # their transitive imports resolve react / marked / lz-string, and without this
      # step the suite dies at COLLECT time with ERR_MODULE_NOT_FOUND — while a dev box
      # stays green, because it has dashboard/node_modules left over from the last
      # `npm run build`. Exactly the local-green/CI-red split this workflow exists to
      # close.
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      # The integration suite spawns the COMPILED CLI at dist/index.js
      # (tests/integration/*.test.ts and a few unit tests do
      # `const CLI = join(__dirname, '..', '..', 'dist', 'index.js')`), so the CLI
      # must be built BEFORE tests run. Locally the publish checklist always runs
      # `npm run build && npm test`; without this step CI has no dist/ and the whole
      # CLI-integration suite fails ENOENT — which is exactly why main went red while
      # local stayed green. `build:cli` (tsup) is sufficient: it emits a
      # self-contained dist/index.js and copies templates/agents/skill-packs/hooks.
      # The heavier dashboard BUILD is still skipped — no test reads dist/dashboard.
      # (Its deps are installed above, but only so vitest can resolve imports.)
      - name: Build the CLI
        run: npm run build:cli

      # `npm test` is bare `vitest` (watch mode), so pass `run` for a single
      # non-interactive pass. vitest is scoped to tests/**/*.test.ts; the
      # Playwright e2e specs under e2e/ are NOT run here.
      #
      # `--silent --reporter=dot` is not cosmetic, it is the fix for the run that
      # reported "6246 passed, 0 failed" and still exited 1. Every line a test
      # prints and every per-test update crosses the worker→main reporter RPC, and
      # this suite prints a LOT on purpose — the lab/sync/migration paths assert
      # their loud failures. Under a 2-fork runner that traffic starves the RPC
      # until vitest raises `Timeout calling "onTaskUpdate"` as an unhandled error,
      # which fails the job with nothing failing in it (see the config's note on
      # why the pool is `forks`, and the task tracking this flake). Dropping the
      # per-test chatter removes the load rather than raising a timeout to outrun
      # it. A failing test still prints its full diff: `--silent` suppresses test
      # CONSOLE output, not vitest's own failure report.
      - name: Run unit + integration tests
        run: npm test -- run --silent --reporter=dot
