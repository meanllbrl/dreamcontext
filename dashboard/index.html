<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <script>try{var q=new URLSearchParams(location.search);if(q.get('embed')){var r=document.documentElement,t=q.get('theme'),b=q.get('bg');if(t==='light'||t==='dark'){r.setAttribute('data-theme',t);r.style.colorScheme=t}else if(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches){r.setAttribute('data-theme','dark');r.style.colorScheme='dark'}if(b&&/^#[0-9a-f]{6}$/.test(b)){r.style.background=b;r.style.setProperty('--color-bg',b)}}}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>dreamcontext — the persistent brain for your AI agents</title>
    <meta name="description" content="dreamcontext is the persistent brain for your AI agents. Ask Sleepy anything about your project — grounded, local, no tokens." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="dreamcontext" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>try{var z=localStorage.getItem('dreamcontext-zoom');if(z)document.documentElement.style.setProperty('--zoom',z)}catch(e){}</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
